apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "eleel.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "eleel.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "eleel.chart" . }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "eleel.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  serviceName: {{ include "eleel.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "eleel.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "eleel=debug"
            - name: LISTEN_ADDRESS
              value: "{{ .Values.config.listenAddress }}"
            - name: LISTEN_PORT
              value: "{{ .Values.config.listenPort }}"
            - name: EE_URL
              value: "{{ .Values.config.eeUrl }}"
            - name: NETWORK
              value: "{{ .Values.config.network }}"
            - name: EE_JWT_SECRET
              value: "{{ .Values.secrets.eeJwtSecret.mountPath }}/{{ .Values.secrets.eeJwtSecret.fileName }}"
            - name: CONTROLLER_JWT_SECRET
              value: "{{ .Values.secrets.controllerJwtSecret.mountPath }}/{{ .Values.secrets.controllerJwtSecret.fileName }}"
            - name: CLIENT_JWT_SECRETS
              value: "{{ .Values.secrets.clientJwtSecrets.mountPath }}/{{ .Values.secrets.clientJwtSecrets.fileName }}"
          volumeMounts:
            - name: jwt-secrets
              mountPath: {{ .Values.secrets.eeJwtSecret.mountPath }}
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
      volumes:
        - name: jwt-secrets
          secret:
            secretName: "{{ .Release.Name }}-jwt-secrets"